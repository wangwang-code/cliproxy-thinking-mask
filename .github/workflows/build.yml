name: build

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build-linux-amd64:
    name: Build linux/amd64 plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # build.sh forces CGO_ENABLED=1 GOOS=linux GOARCH=amd64, so the cgo C-ABI
      # entrypoint (main.go) is compiled with the runner's gcc and produces the
      # CLIProxyAPI plugin shared library.
      - name: Build .so (c-shared)
        run: bash build.sh

      - name: Show artifact
        run: file cliproxy-thinking-mask.so

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: cliproxy-thinking-mask-linux-amd64
          path: cliproxy-thinking-mask.so
          if-no-files-found: error
          retention-days: 30

  build-patched-cpa:
    name: Build patched CPA linux/amd64 binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin repo
        uses: actions/checkout@v4

      - name: Checkout CLIProxyAPI
        uses: actions/checkout@v4
        with:
          repository: router-for-me/CLIProxyAPI
          path: CLIProxyAPI
          ref: d198db54d4c4886c99b21488d54fc576933019a3

      - name: Apply CPA overlay patch
        run: |
          cp -R _cpa-overlay/. CLIProxyAPI/
          git -C CLIProxyAPI diff --stat
          git -C CLIProxyAPI status --short

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: CLIProxyAPI/go.mod
          cache-dependency-path: CLIProxyAPI/go.sum
          cache: true

      - name: Vet patched CPA
        working-directory: CLIProxyAPI
        run: go vet ./...

      - name: Test patched CPA
        working-directory: CLIProxyAPI
        run: |
          go test ./sdk/api/handlers/openai/ -run 'TestBuildEarlyThinkingChunk'
          go test ./sdk/api/handlers/ -run 'TestIsOverloadBootstrapError|TestFailoverConfigEnabled|TestFailoverTerminalError'

      - name: Build patched CPA linux/amd64
        working-directory: CLIProxyAPI
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=1 go build \
            -trimpath -ldflags="-s -w" \
            -o cli-proxy-api-linux-amd64 ./cmd/server
          file cli-proxy-api-linux-amd64

      - name: Upload patched CPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: cliproxy-thinking-mask-cpa-linux-amd64
          path: CLIProxyAPI/cli-proxy-api-linux-amd64
          if-no-files-found: error
          retention-days: 30
