# Snippet for CLIProxyAPI config.yaml.
# Put this under your global `plugins:` section to enable the plugin.
plugins:
  enabled: true
  configs:
    cliproxy-thinking-mask:
      enabled: true
      priority: 100
      # Optional: text attached to the first content frame as
      # delta.reasoning_content. Leave unset to use the built-in default.
      thinking-text: "Let me think through this step by step before giving the final answer."

# ---------------------------------------------------------------------------
# Codex retry tuning (CPA overlay patch, shipped with the patched cli-proxy-api
# binary). All optional; defaults match the previous fixed behavior.
# ---------------------------------------------------------------------------
codex:
  # In-place retry of codex upstream requests on transport-level failures
  # (EOF / TLS handshake / dial / connection reset) BEFORE any HTTP status is
  # received. Unset (0) falls back to legacy env CODEX_CONN_RETRIES, then to a
  # default of 2. Set to a negative value to disable.
  connection-retry: 2
  connection-retry-interval: "500ms"
  # Token refresh retry attempts per refresh call. Unset (0) uses the historical
  # default of 3. Set a negative value for a single attempt (no retry). The
  # 401-with-invalidated-refresh-token case cannot be fixed by retrying, so
  # consider 1 (or negative) to fail fast and let the credential automation
  # disable the account.
  refresh-retries: 3
  refresh-retry-interval: "1s"

# ---------------------------------------------------------------------------
# Failover (CPA overlay patch, shipped with the patched cli-proxy-api binary).
# Silent failover of /v1/chat/completions when the primary provider (e.g. the
# codex OAuth pool) rejects the request with an overload / 502 / 503 error at
# bootstrap. Every endpoint listed below must also be ENABLED (disabled: false)
# under the top-level `openai-compatibility` list, otherwise it cannot be used.
# ---------------------------------------------------------------------------
failover:
  enabled: true
  # Only trigger when the failing attempt was routed to one of these providers.
  # "codex" is the internal provider key used by the codex OAuth pool.
  primary-providers:
    - codex
  # Fallback endpoints, tried in ascending priority order.
  endpoints:
    - name: "grok web"            # must match an enabled openai-compatibility name
      priority: 1
      # Optional model override sent to this endpoint. Leave empty to keep the
      # requested model (the endpoint's own alias mapping, if any, is used).
      model: ""
  # Synthetic error returned when EVERY endpoint also fails:
  #   {"error":{"type":...,"code":...,"message":...,"param":null}}
  terminal-status: 502
  terminal-type: "service_unavailable_error"
  terminal-code: "server_is_overloaded"
  terminal-message: "云翻译服务暂不可用，请稍后重试"

# ---------------------------------------------------------------------------
# Upstream error message rewrite (CPA overlay patch, shipped with the patched
# cli-proxy-api binary). When enabled, matching upstream error responses are
# replaced with the configured client-facing message instead of leaking the
# raw upstream body / headers / identity.
# ---------------------------------------------------------------------------
error-rewrite:
  enabled: true
  # Used when a status has no explicit entry below. Empty means leave those
  # statuses untouched.
  default-message: "[云翻译]上游服务暂时不可用，请稍后重试"
  status-messages:
    "429": "[云翻译]被上游限流，请稍微再试"
    "500": "[云翻译]上游服务暂时不可用，请稍后重试"
    "502": "[云翻译]上游服务暂时不可用，请稍后重试"
    "503": "[云翻译]上游服务暂时不可用，请稍后重试"

# ---------------------------------------------------------------------------
# Streaming (CPA overlay patch, shipped with the patched cli-proxy-api binary).
# Enables preemptive fake thinking while waiting for the upstream first token.
# ---------------------------------------------------------------------------
streaming:
  # SSE heartbeats + preemptive fake thinking. Set > 0 to enable.
  keepalive-seconds: 15
  # Text sent immediately after the SSE stream commits (before the first keepalive).
  fake-thinking-text: "Let me think through this step by step before giving the final answer."
  # Optional ordered texts sent on each subsequent keepalive tick, in order:
  # 1st keepalive -> first item, 2nd keepalive -> second item, etc.
  # When exhausted, keepalives return to comment-only heartbeats.
  fake-thinking-texts:
    - "第一次Keepalive的文案"
    - "第二次"
    - "第三次"
    - "第四次"
  # How long to wait for the first valid upstream SSE event before treating the
  # current upstream attempt as dead and retrying from the pool. Empty/0 disables.
  # Recommended for production: "5s".
  first-event-timeout: "5s"
  # After at least one SSE event has arrived, how long to wait for the next event
  # before considering the upstream stream stalled and terminating it with an
  # error to the client. Empty/0 disables.
  stall-timeout: "10s"

# ---------------------------------------------------------------------------
# Upstream stream budgets (CPA overlay patch). Matches requests by API key and/or
# model, computes a dynamic byte budget from the request text size, and aborts a
# runaway upstream stream with the fixed payload:
#   {"error":{"type":"server_error","code":"upstream_response_too_large","message":"模型输出失控，已中止"}}
# ---------------------------------------------------------------------------
stream-limits:
  enabled: true
  rules:
    - name: "translation"
      api-keys:
        - "sk-REPLACE_WITH_TRANSLATION_KEY"
      models:
        - "gpt-5.6-*"
      input-budget:
        base-bytes: 65536
        bytes-per-input-char: 32
        min-bytes: 131072
        max-bytes: 1048576
      max-stream-duration: "30s"
      max-content-chars: 32768
